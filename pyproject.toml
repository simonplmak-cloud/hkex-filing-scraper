[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hkex-filing-scraper"
dynamic = ["version"]
description = "Scrape and ingest HKEx (Hong Kong Stock Exchange) regulatory filings into PostgreSQL, MySQL/MariaDB, SQLite, MongoDB, Neo4j, ClickHouse, DuckDB, or SurrealDB with full-text extraction and graph linking."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Simon Mak" },
]
keywords = [
    "hkex",
    "hong-kong",
    "hong-kong-stock-exchange",
    "filings",
    "regulatory-filings",
    "scraper",
    "financial-data",
    "data-pipeline",
    "data-engineering",
    "etl",
    "multi-database",
    "postgresql",
    "mysql",
    "sqlite",
    "duckdb",
    "mongodb",
    "clickhouse",
    "neo4j",
    "surrealdb",
    "graph-database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Database",
]

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
# AGPL-3.0: PyMuPDF/pymupdf4llm. Deliberately excluded from [all] so the default
# install stays permissive. See docs/legal.md#third-party-licences.
pdf = ["PyMuPDF>=1.23", "pymupdf4llm>=0.0.17", "camelot-py>=0.11"]
excel = ["openpyxl>=3.1"]
postgres = ["psycopg[binary,pool]>=3.1"]
mysql = ["PyMySQL[rsa]>=1.1"]
duckdb = ["duckdb>=1.0"]
mongodb = ["pymongo>=4.6"]
clickhouse = ["clickhouse-connect>=0.7"]
neo4j = ["neo4j>=5.20"]
mcp = ["mcp>=1.30,<2"]
all = [
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.1",
    "PyMySQL[rsa]>=1.1",
    "duckdb>=1.0",
    "pymongo>=4.6",
    "clickhouse-connect>=0.7",
    "neo4j>=5.20",
    "mcp>=1.30,<2",
]
dev = [
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.16,<0.17",
]

[project.scripts]
hkex-scraper = "hkex_scraper.main:main"
hkex-scraper-mcp = "hkex_scraper.mcp_server:main"

[project.urls]
Homepage = "https://github.com/simonplmak-cloud/hkex-filing-scraper"
Documentation = "https://simonplmak-cloud.github.io/hkex-filing-scraper/"
Repository = "https://github.com/simonplmak-cloud/hkex-filing-scraper"
Issues = "https://github.com/simonplmak-cloud/hkex-filing-scraper/issues"
Changelog = "https://github.com/simonplmak-cloud/hkex-filing-scraper/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hkex_scraper"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/hkex_scraper/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "network: requires real outbound network access (excluded from the default run)",
]

[tool.coverage.run]
branch = true
source = ["src/hkex_scraper"]

[tool.coverage.report]
# RATCHET: this floor only rises. Raise it whenever coverage improves; never lower it to
# make a build pass. It is measured over the unit suite, which cannot execute the live-only
# modules (sink drivers, extractor, SurrealDB/PostgreSQL/Neo4j/MongoDB/ClickHouse adapters) —
# those are exercised by the integration CI jobs instead. See CONTRIBUTING.md.
fail_under = 46  # measured 47.3%; raise, never lower
show_missing = true
skip_covered = true
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pin the historical ruff default selection explicitly. Ruff >= 0.16 broadened
# its implicit defaults (UP/BLE/DTZ/SIM/…) which is a breaking change for this
# project; pinning keeps `ruff check` deterministic across ruff versions.
select = ["E4", "E7", "E9", "F"]
