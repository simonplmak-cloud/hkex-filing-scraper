[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hkex-filing-scraper"
dynamic = ["version"]
description = "Scrape and ingest HKEx (Hong Kong Stock Exchange) regulatory filings into SurrealDB and/or PostgreSQL with full-text extraction and graph linking."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Simon Mak" },
]
keywords = ["hkex", "hong-kong", "filings", "scraper", "surrealdb", "postgresql", "dual-write", "graph-database", "financial-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Database",
]

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23", "pymupdf4llm>=0.0.17", "camelot-py[cv]>=0.11"]
excel = ["openpyxl>=3.1"]
postgres = ["psycopg[binary,pool]>=3.1"]
all = [
    "PyMuPDF>=1.23",
    "pymupdf4llm>=0.0.17",
    "camelot-py[cv]>=0.11",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "psycopg[binary,pool]>=3.1",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.16,<0.17",
]

[project.scripts]
hkex-scraper = "hkex_scraper.main:main"

[project.urls]
Homepage = "https://github.com/simonplmak-cloud/hkex-filing-scraper"
Repository = "https://github.com/simonplmak-cloud/hkex-filing-scraper"
Issues = "https://github.com/simonplmak-cloud/hkex-filing-scraper/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/hkex_scraper"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/hkex_scraper/_version.py"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Pin the historical ruff default selection explicitly. Ruff >= 0.16 broadened
# its implicit defaults (UP/BLE/DTZ/SIM/…) which is a breaking change for this
# project; pinning keeps `ruff check` deterministic across ruff versions.
select = ["E4", "E7", "E9", "F"]
