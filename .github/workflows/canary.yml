name: Canary

# Early-warning control for risk R1: the undocumented HKEx API changing shape.
# Runs the real fetch path against a small recent window once a day, and opens an issue
# (or comments on the existing one) when the response no longer matches what the scraper
# depends on. Target: detect an API break within 24 hours.

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: HKEx API canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # create/comment on the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the package
        run: pip install --quiet .

      - name: Run the canary
        id: canary
        run: |
          set +e
          set -o pipefail
          python scripts/canary.py --days 7 --max 5 --json | tee canary.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Report a failure on the tracking issue
        if: steps.canary.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Canary: HKEx API response shape changed"
          BODY="$(printf 'The scheduled canary failed on %s.\n\n```json\n%s\n```\n\nSee the workflow run: %s/%s/actions/runs/%s' \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$(cat canary.json)" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"
          EXISTING="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label bug
          fi

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: canary-report
          path: canary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the run when the canary failed
        if: steps.canary.outputs.exit_code != '0'
        run: exit 1
