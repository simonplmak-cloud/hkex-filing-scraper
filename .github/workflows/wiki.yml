name: Wiki

# Mirror the mkdocs sources under docs/ into the GitHub wiki. The docs site stays the
# source of truth; the wiki is generated. The job is a no-op until the WIKI_TOKEN secret
# exists, so the workflow is safe to land before the token is created.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/mirror_wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-mirror
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror docs to wiki
    runs-on: ubuntu-latest
    # The wiki token is only exposed to runs approved through this environment.
    environment: wiki
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check for WIKI_TOKEN
        id: token
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "${WIKI_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WIKI_TOKEN is not set; skipping the wiki mirror. Create a classic PAT with the 'repo' scope and add it as the WIKI_TOKEN repository secret."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify every doc is mapped
        if: steps.token.outputs.present == 'true'
        run: python scripts/mirror_wiki.py --check

      - name: Generate wiki pages
        if: steps.token.outputs.present == 'true'
        run: python scripts/mirror_wiki.py --out build/wiki --repo "${{ github.repository }}"

      - name: Push to the wiki
        if: steps.token.outputs.present == 'true'
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "::add-mask::${WIKI_TOKEN}"
          cd build/wiki
          git init -q -b master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${WIKI_TOKEN}@github.com/${REPO}.wiki.git"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "docs: mirror wiki from ${GITHUB_SHA::7}"
            git push --force origin master
            echo "Wiki updated."
          else
            echo "No wiki changes."
          fi
