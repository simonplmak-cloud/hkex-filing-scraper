name: PyPI

# Publish the built distributions to PyPI. Runs alongside the GitHub Release workflow on a
# tag push, and can be re-run by hand for a specific tag (for example, after the first-time
# project creation on PyPI). It is a no-op until the PYPI_TOKEN secret exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build

      - name: Validate the distribution metadata and README
        run: python -m twine check --strict dist/*

      - name: Check for the PyPI token
        id: token
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -z "${PYPI_TOKEN}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PYPI_TOKEN is not set; skipping the upload. Create an API token at pypi.org (scoped to this project) and add it as the PYPI_TOKEN repository secret."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.token.outputs.present == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          print-hash: true
