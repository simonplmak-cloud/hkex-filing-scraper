name: PyPI

# Publish the built distributions to PyPI using Trusted Publishing (OpenID Connect):
# the job authenticates to PyPI with a short-lived OIDC token, so no long-lived API token
# exists anywhere. Runs alongside the GitHub Release workflow on a tag push, and can be
# re-run by hand for a specific tag. `skip-existing` makes re-dispatch idempotent.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v2.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC identity for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --quiet --upgrade build twine
          python -m build

      - name: Validate the distribution metadata and README
        run: python -m twine check --strict dist/*

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          print-hash: true
