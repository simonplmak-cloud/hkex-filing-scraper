name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check
      - name: ruff format --check
        run: ruff format --check

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Lockfile is current
        run: uv lock --check
      - name: Install exactly from the lockfile
        run: uv sync --frozen --all-extras
      - name: Export the locked runtime dependency set
        # Runtime extras that ship in `all`. The AGPL `pdf` extra and the `dev` tooling are
        # deliberately excluded; tests/test_supply_chain.py keeps this list in step with pyproject.
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project \
            --extra excel --extra postgres --extra mysql --extra duckdb \
            --extra mongodb --extra clickhouse --extra neo4j \
            --output-file /tmp/requirements-runtime.txt
      - name: Audit the locked set for known vulnerabilities
        run: uvx --from pip-audit pip-audit --strict --requirement /tmp/requirements-runtime.txt
      - name: License policy (no copyleft in the all extra)
        run: |
          python -m venv /tmp/licenses
          /tmp/licenses/bin/pip install --quiet ".[all]"
          /tmp/licenses/bin/python scripts/check_licenses.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-matrix:
    name: Install (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [".", ".[all]"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install the documented way
        run: pip install "${{ matrix.extra }}"
      - name: CLI smoke
        run: hkex-scraper --help >/dev/null

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,duckdb]"
      - name: pytest
        run: pytest -q

  integration-postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: hkex
          POSTGRES_PASSWORD: hkex
          POSTGRES_DB: hkex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Integration tests
        env:
          DATABASE_TARGET: postgres
          POSTGRES_DSN: postgresql://hkex:hkex@localhost:5432/hkex
        run: pytest -q tests/test_postgres_integration.py

  integration-mysql:
    name: MySQL / MariaDB integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hkex
          MYSQL_USER: hkex
          MYSQL_PASSWORD: hkex
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11@sha256:8b5f33ebd85d1775657e974ed10434128bb493c80e826ceaa54074fd1a92a112
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hkex
          MARIADB_USER: hkex
          MARIADB_PASSWORD: hkex
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,mysql]"
      - name: Integration tests
        env:
          DATABASE_TARGET: mysql,mariadb
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: hkex
          MYSQL_USER: hkex
          MYSQL_PASSWORD: hkex
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: "3307"
          MARIADB_DATABASE: hkex
          MARIADB_USER: hkex
          MARIADB_PASSWORD: hkex
        run: pytest -q tests/test_mysql_integration.py

  integration-surrealdb:
    name: SurrealDB integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3.2.4@sha256:51baed8709f57f67dcf04b30e3177db846803fa9342dae2be58c6fa5f8d59843 start --log warn --user root --pass root --bind 0.0.0.0:8000 memory
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Integration tests
        env:
          DATABASE_TARGET: surrealdb
          SURREAL_ENDPOINT: http://localhost:8000
          SURREAL_NAMESPACE: test
          SURREAL_DATABASE: hkex
          SURREAL_USERNAME: root
          SURREAL_PASSWORD: root
          COMPANY_TABLE: company
        run: pytest -q tests/test_surrealdb_integration.py

  integration-multi-sink:
    name: Multi-sink integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: hkex
          POSTGRES_PASSWORD: hkex
          POSTGRES_DB: hkex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3.2.4@sha256:51baed8709f57f67dcf04b30e3177db846803fa9342dae2be58c6fa5f8d59843 start --log warn --user root --pass root --bind 0.0.0.0:8000 memory
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Integration tests (both sinks)
        env:
          DATABASE_TARGET: surrealdb,postgres
          SURREAL_ENDPOINT: http://localhost:8000
          SURREAL_NAMESPACE: test
          SURREAL_DATABASE: hkex
          SURREAL_USERNAME: root
          SURREAL_PASSWORD: root
          POSTGRES_DSN: postgresql://hkex:hkex@localhost:5432/hkex
          COMPANY_TABLE: company
        run: |
          pytest -q \
            tests/test_postgres_integration.py \
            tests/test_surrealdb_integration.py \
            tests/test_multi_sink_integration.py

  integration-sinks-extra:
    name: Sinks integration (MongoDB, ClickHouse, Neo4j)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7@sha256:9854f7139445d766a9523571d6f047530c45547460ffcf8259eb2bf4264632ca
        ports:
          - 27017:27017
      clickhouse:
        image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
        env:
          CLICKHOUSE_DB: hkex
          CLICKHOUSE_USER: hkex
          CLICKHOUSE_PASSWORD: hkex
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
      neo4j:
        image: neo4j:5@sha256:bb268a2f1b4f3c79e4bd1a00a82a6e63bbd4fcc4088da03c1b2380655f256cb2
        env:
          NEO4J_AUTH: neo4j/hkexpassword
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,mongodb,clickhouse,neo4j]"
      - name: Wait for services
        run: |
          for _ in $(seq 1 60); do curl -sf http://localhost:8123/ping && break; sleep 2; done
      - name: Integration tests
        env:
          DATABASE_TARGET: mongodb,clickhouse,neo4j
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: hkex
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_DATABASE: hkex
          CLICKHOUSE_USER: hkex
          CLICKHOUSE_PASSWORD: hkex
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: hkexpassword
        run: pytest -q tests/test_extra_sinks_integration.py
