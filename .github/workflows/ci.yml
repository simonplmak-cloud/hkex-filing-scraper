name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check
      - name: ruff format --check
        run: ruff format --check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  install-matrix:
    name: Install (${{ matrix.extra }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [".", ".[all]"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the documented way
        run: pip install "${{ matrix.extra }}"
      - name: CLI smoke
        run: hkex-scraper --help >/dev/null

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev,duckdb]"
      - name: pytest
        run: pytest -q

  integration-postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hkex
          POSTGRES_PASSWORD: hkex
          POSTGRES_DB: hkex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Integration tests
        env:
          DATABASE_TARGET: postgres
          POSTGRES_DSN: postgresql://hkex:hkex@localhost:5432/hkex
        run: pytest -q tests/test_postgres_integration.py

  integration-mysql:
    name: MySQL / MariaDB integration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hkex
          MYSQL_USER: hkex
          MYSQL_PASSWORD: hkex
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hkex
          MARIADB_USER: hkex
          MARIADB_PASSWORD: hkex
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,mysql]"
      - name: Integration tests
        env:
          DATABASE_TARGET: mysql,mariadb
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: "3306"
          MYSQL_DATABASE: hkex
          MYSQL_USER: hkex
          MYSQL_PASSWORD: hkex
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: "3307"
          MARIADB_DATABASE: hkex
          MARIADB_USER: hkex
          MARIADB_PASSWORD: hkex
        run: pytest -q tests/test_mysql_integration.py

  integration-surrealdb:
    name: SurrealDB integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3.2.4 start --log warn --user root --pass root --bind 0.0.0.0:8000 memory
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Integration tests
        env:
          DATABASE_TARGET: surrealdb
          SURREAL_ENDPOINT: http://localhost:8000
          SURREAL_NAMESPACE: test
          SURREAL_DATABASE: hkex
          SURREAL_USERNAME: root
          SURREAL_PASSWORD: root
          COMPANY_TABLE: company
        run: pytest -q tests/test_surrealdb_integration.py

  integration-dual-write:
    name: Dual-write integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hkex
          POSTGRES_PASSWORD: hkex
          POSTGRES_DB: hkex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,postgres]"
      - name: Start SurrealDB
        run: |
          docker run -d --name surrealdb -p 8000:8000 \
            surrealdb/surrealdb:v3.2.4 start --log warn --user root --pass root --bind 0.0.0.0:8000 memory
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: Integration tests (both sinks)
        env:
          DATABASE_TARGET: surrealdb,postgres
          SURREAL_ENDPOINT: http://localhost:8000
          SURREAL_NAMESPACE: test
          SURREAL_DATABASE: hkex
          SURREAL_USERNAME: root
          SURREAL_PASSWORD: root
          POSTGRES_DSN: postgresql://hkex:hkex@localhost:5432/hkex
          COMPANY_TABLE: company
        run: |
          pytest -q \
            tests/test_postgres_integration.py \
            tests/test_surrealdb_integration.py \
            tests/test_dual_write_integration.py

  integration-tier2:
    name: Tier 2 integration (MongoDB, ClickHouse, Neo4j)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: hkex
          CLICKHOUSE_USER: hkex
          CLICKHOUSE_PASSWORD: hkex
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
        ports:
          - 8123:8123
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/hkexpassword
        ports:
          - 7687:7687
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev,mongodb,clickhouse,neo4j]"
      - name: Wait for services
        run: |
          for _ in $(seq 1 60); do curl -sf http://localhost:8123/ping && break; sleep 2; done
      - name: Integration tests
        env:
          DATABASE_TARGET: mongodb,clickhouse,neo4j
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: hkex
          CLICKHOUSE_HOST: localhost
          CLICKHOUSE_PORT: "8123"
          CLICKHOUSE_DATABASE: hkex
          CLICKHOUSE_USER: hkex
          CLICKHOUSE_PASSWORD: hkex
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: hkexpassword
        run: pytest -q tests/test_tier2_integration.py
