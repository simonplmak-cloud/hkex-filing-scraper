name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem does this solve? Who benefits?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like. Include CLI/config sketches if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scraping / API
        - Document extraction
        - PostgreSQL sink
        - MySQL / MariaDB sink
        - SQLite / DuckDB sink
        - MongoDB sink
        - ClickHouse sink
        - Neo4j sink
        - SurrealDB sink
        - Graph linking
        - CLI / configuration
        - Documentation
        - Other
    validations:
      required: true
