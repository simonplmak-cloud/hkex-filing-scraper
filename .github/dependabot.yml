version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

# Container images are pinned by digest in .github/workflows/ci.yml and
# examples/docker-compose.yml. Dependabot's `docker` ecosystem only understands Dockerfiles
# and Kubernetes YAML (not compose files), so those digests are bumped manually when an
# engine release is worth adopting.
