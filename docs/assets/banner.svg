<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="HKEx Filing Scraper — HKEx filings, live for AI agents, and nine databases to keep them">
  <defs>
    <style>
      .mono { font-family: "DejaVu Sans Mono", "Liberation Mono", ui-monospace, Menlo, Consolas, monospace; }
      .title { font-size: 44px; font-weight: 700; fill: #e6e6e6; }
      .tagline { font-size: 20px; fill: #ffd580; }
      .chip { font-size: 16px; fill: #e6e6e6; }
      .panel { fill: #111111; stroke: #2a2a2a; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1280" height="300" fill="#0b0b0b"/>
  <rect x="0" y="0" width="1280" height="4" fill="#ffb000"/>

  <text class="mono title" x="56" y="104">HKEx Filing Scraper</text>
  <text class="mono tagline" x="56" y="146">HKEx filings, live for AI agents — and nine databases to keep them</text>

  <rect class="panel" x="56" y="186" width="196" height="50" rx="8" stroke="#ffb000"/>
  <text class="mono chip" x="80" y="217">MCP · AI agents</text>

  <rect class="panel" x="268" y="186" width="158" height="50" rx="8" stroke="#7ee787"/>
  <text class="mono chip" x="292" y="217">9 databases</text>

  <rect class="panel" x="442" y="186" width="139" height="50" rx="8"/>
  <text class="mono chip" x="466" y="217">read-only</text>

  <rect class="panel" x="597" y="186" width="148" height="50" rx="8"/>
  <text class="mono chip" x="621" y="217">no API key</text>

  <rect class="panel" x="761" y="186" width="121" height="50" rx="8"/>
  <text class="mono chip" x="785" y="217">MIT</text>
</svg>
