<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     font-family="DejaVu Sans, Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111C2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF00A0"/>
      <stop offset="100%" stop-color="#4169E1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>

  <text x="80" y="150" fill="#7C8AA5" font-size="26" letter-spacing="6">OPEN-SOURCE ETL FOR HONG KONG FILINGS</text>
  <text x="80" y="248" fill="#FFFFFF" font-size="76" font-weight="bold">HKEx Filing Scraper</text>
  <text x="80" y="308" fill="#C3CEDF" font-size="30">25+ years of regulatory filings — scraped, extracted, and stored.</text>

  <!-- Sink cards -->
  <g>
    <rect x="80" y="372" width="500" height="150" rx="18" fill="#16233A" stroke="#FF00A0" stroke-width="2"/>
    <circle cx="128" cy="422" r="12" fill="#FF00A0"/>
    <text x="158" y="432" fill="#FFFFFF" font-size="34" font-weight="bold">SurrealDB</text>
    <text x="128" y="480" fill="#9FB0C9" font-size="24">Graph edges · SCHEMAFULL · /rpc</text>
  </g>

  <g>
    <rect x="700" y="372" width="500" height="150" rx="18" fill="#16233A" stroke="#4169E1" stroke-width="2"/>
    <circle cx="748" cy="422" r="12" fill="#4169E1"/>
    <text x="778" y="432" fill="#FFFFFF" font-size="34" font-weight="bold">PostgreSQL</text>
    <text x="748" y="480" fill="#9FB0C9" font-size="24">Relational · JSONB · ON CONFLICT</text>
  </g>

  <text x="640" y="462" fill="#7C8AA5" font-size="30" text-anchor="middle">or both</text>
  <path d="M600 447 L680 447" stroke="#3C4B63" stroke-width="2" stroke-dasharray="6 6"/>
  <path d="M680 447 L672 441 M680 447 L672 453" stroke="#3C4B63" stroke-width="2" fill="none"/>

  <text x="80" y="588" fill="#5F6E85" font-size="24">github.com/simonplmak-cloud/hkex-filing-scraper</text>
  <text x="1200" y="588" fill="#5F6E85" font-size="24" text-anchor="end">Python 3.10+ · MIT</text>
</svg>
