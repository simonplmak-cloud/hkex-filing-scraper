site_name: HKEx Filing Scraper
site_description: Scrape and ingest HKEx regulatory filings into PostgreSQL, MySQL/MariaDB, SQLite, MongoDB, Neo4j, ClickHouse, DuckDB, or SurrealDB.
site_url: https://simonplmak-cloud.github.io/hkex-filing-scraper/
site_author: Simon Mak
repo_url: https://github.com/simonplmak-cloud/hkex-filing-scraper
repo_name: simonplmak-cloud/hkex-filing-scraper
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  # Fixed dark theme (terminal style): no light mode, no colour-scheme toggle.
  palette:
    scheme: slate
    primary: black
    accent: amber
  # No Google Fonts request; the stylesheet uses the system monospace stack.
  font: false
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
extra_css:
  - assets/stylesheets/terminal.css
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Sinks:
      - Overview: sinks/README.md
      - PostgreSQL: sinks/postgresql.md
      - MySQL and MariaDB: sinks/mysql.md
      - SQLite: sinks/sqlite.md
      - MongoDB: sinks/mongodb.md
      - Neo4j: sinks/neo4j.md
      - ClickHouse: sinks/clickhouse.md
      - DuckDB: sinks/duckdb.md
      - SurrealDB: sinks/surrealdb.md
  - Configuration: configuration.md
  - CLI: cli.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md
  - Testing: testing.md
  - Project:
      - Style guide: STYLE.md
      - De-risking: de-risking.md
      - Legal: legal.md
      - Upgrading: upgrading.md
  - Releasing:
      - How to release: releasing.md
      - Automation reference: release-automation.md
  - Decisions:
      - ADR 0001 — Versioning: adr/0001-versioning-and-release-automation.md
      - ADR 0002 — Multi-sink: adr/0002-multi-sink-architecture.md
      - ADR 0003 — Support policy: adr/0003-sink-support-policy.md
