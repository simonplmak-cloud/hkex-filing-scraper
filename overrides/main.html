{% extends "base.html" %}

{# Static OpenGraph / Twitter card metadata for the docs site.
   Material already emits og:title/og:description/og:url and the canonical link;
   this adds the social preview image and card type. #}
{% block extrahead %}
  {{ super() }}
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://simonplmak-cloud.github.io/hkex-filing-scraper/social_preview.png" />
  <meta property="og:image:alt" content="HKEx Filing Scraper — one scraper, many databases" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://simonplmak-cloud.github.io/hkex-filing-scraper/social_preview.png" />
  <meta name="twitter:image:alt" content="HKEx Filing Scraper — one scraper, many databases" />
{% endblock %}
