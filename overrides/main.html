{% extends "base.html" %}

{# Static OpenGraph / Twitter card metadata for the docs site.
   Material already emits og:title/og:description/og:url and the canonical link;
   this adds the social preview image and card type. #}
{% block extrahead %}
  {{ super() }}
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://hkex-listco-updates.ascent-partners.com/social_preview.png?v=2" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:alt" content="HKEx Filing Scraper — HKEx filings, live for AI agents, and nine databases to keep them" />
  <meta property="og:image:width" content="1280" />
  <meta property="og:image:height" content="640" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://hkex-listco-updates.ascent-partners.com/social_preview.png?v=2" />
  <meta name="twitter:image:alt" content="HKEx Filing Scraper — HKEx filings, live for AI agents, and nine databases to keep them" />
{% endblock %}
